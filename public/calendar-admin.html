<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Matt McClay — Calendar Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --dark:  #0d2535;
    --navy:  #133951;
    --gold:  #DA9100;
    --pearl: #B0B7BE;
    --bone:  #E3DAC9;
    --clay:  #BD5C00;
  }
  body { background: var(--dark); color: var(--bone); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 14px; padding: 40px;
  }
  #login-screen h1 { font-size: 22px; color: var(--bone); letter-spacing: 0.06em; }
  #login-screen p  { font-size: 13px; color: rgba(227,218,201,0.45); }
  #pw-input {
    background: rgba(255,255,255,0.06); border: 0.5px solid rgba(227,218,201,0.2);
    border-radius: 8px; padding: 13px 18px; font-size: 15px; color: var(--bone);
    outline: none; width: 260px; text-align: center; letter-spacing: 0.1em;
  }
  #pw-input:focus { border-color: var(--gold); }
  #login-btn {
    background: var(--gold); color: var(--dark); border: none; border-radius: 8px;
    padding: 13px 32px; font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: 0.06em; text-transform: uppercase; width: 260px;
  }
  #login-error { font-size: 12px; color: #f87171; display: none; }

  /* ADMIN */
  #admin-screen { display: none; }

  header {
    background: rgba(13,37,53,0.97); border-bottom: 0.5px solid rgba(218,145,0,0.2);
    padding: 16px 40px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 100;
    gap: 16px; flex-wrap: wrap;
  }
  .brand      { font-size: 15px; color: var(--bone); letter-spacing: 0.06em; font-weight: 600; }
  .brand span { color: var(--gold); font-size: 10px; font-weight: 400; display: block; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

  #status-bar {
    font-size: 13px; padding: 10px 18px; border-radius: 6px;
    min-width: 220px; text-align: center; font-weight: 600;
  }
  #status-bar.idle    { background: rgba(255,255,255,0.04); color: rgba(227,218,201,0.35); }
  #status-bar.unsaved { background: rgba(218,145,0,0.12);   color: var(--gold); }
  #status-bar.saving  { background: rgba(218,145,0,0.2);    color: var(--gold); }
  #status-bar.success { background: rgba(45,106,79,0.25);   color: #6ee7b7; }
  #status-bar.error   { background: rgba(180,40,40,0.2);    color: #fca5a5; }

  #publish-btn {
    background: var(--gold); color: var(--dark); border: none; border-radius: 8px;
    padding: 12px 28px; font-size: 13px; font-weight: 700; cursor: pointer;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  #publish-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .main { max-width: 980px; margin: 0 auto; padding: 36px 24px 60px; }

  /* LEGEND */
  .legend {
    display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 28px;
    padding: 14px 20px; background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(227,218,201,0.08); border-radius: 10px;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: rgba(227,218,201,0.6); }
  .legend-dot  { width: 13px; height: 13px; border-radius: 3px; }
  .legend-hint { margin-left: auto; font-size: 11px; color: rgba(227,218,201,0.3); }

  /* YEAR TABS */
  .year-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .year-tab {
    background: rgba(255,255,255,0.04); border: 0.5px solid rgba(227,218,201,0.1);
    border-radius: 6px; padding: 8px 24px; font-size: 13px;
    color: rgba(227,218,201,0.5); cursor: pointer; transition: all 0.15s;
  }
  .year-tab.active { background: rgba(218,145,0,0.12); border-color: var(--gold); color: var(--gold); font-weight: 600; }

  /* CALENDAR GRID */
  .cal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media(max-width:700px){ .cal-grid{ grid-template-columns:1fr; } }

  .month-block {
    background: rgba(255,255,255,0.03); border: 0.5px solid rgba(227,218,201,0.07);
    border-radius: 12px; padding: 14px 12px;
  }
  .month-name { font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-bottom: 10px; }
  .dh-grid    { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 3px; }
  .dh         { text-align: center; font-size: 8px; color: rgba(227,218,201,0.28); letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 0; }
  .d-grid     { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }

  .dc {
    aspect-ratio: 1; border-radius: 5px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px;
    cursor: pointer; border: 1px solid transparent; transition: all 0.12s;
    position: relative; user-select: none; gap: 1px;
  }
  .dc.empty   { cursor: default; }
  .dc.past    { color: rgba(227,218,201,0.18); cursor: default; }
  .dc.av      { background: rgba(45,106,79,0.3);    border-color: rgba(45,106,79,0.7);   color: var(--bone); }
  .dc.bk      { background: rgba(180,40,40,0.35);   border-color: rgba(180,40,40,0.7);   color: var(--bone); }
  .dc.hd      { background: rgba(189,92,0,0.35);    border-color: rgba(189,92,0,0.7);    color: var(--bone); }
  .dc.un      { background: rgba(176,183,190,0.12); border-color: rgba(176,183,190,0.3); color: rgba(227,218,201,0.4); }
  .dc.av:hover,
  .dc.bk:hover,
  .dc.hd:hover,
  .dc.un:hover { filter: brightness(1.35); transform: scale(1.1); z-index: 5; }
  .dc-lbl { font-size: 6.5px; color: var(--gold); line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }

  /* CLIENT LABEL POPUP */
  #label-popup {
    display: none; position: fixed; z-index: 500;
    background: var(--navy); border: 1px solid rgba(218,145,0,0.4);
    border-radius: 10px; padding: 16px; width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #label-popup h4  { font-size: 13px; color: var(--bone); margin-bottom: 4px; }
  #label-popup p   { font-size: 11px; color: rgba(227,218,201,0.45); margin-bottom: 12px; }
  #label-input {
    width: 100%; background: rgba(255,255,255,0.07); border: 0.5px solid rgba(227,218,201,0.2);
    border-radius: 6px; padding: 10px 12px; font-size: 13px; color: var(--bone);
    outline: none; margin-bottom: 10px;
  }
  #label-input:focus { border-color: var(--gold); }
  .popup-btns { display: flex; gap: 8px; }
  .popup-btns button { flex:1; padding:9px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; border:none; }
  #lp-save   { background: var(--gold); color: var(--dark); }
  #lp-skip   { background: rgba(255,255,255,0.06); color: var(--bone); }
  #lp-cancel { background: rgba(180,40,40,0.2); color: #fca5a5; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>MATT McCLAY</h1>
  <p>Calendar Admin</p>
  <input id="pw-input" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"/>
  <button id="login-btn" onclick="login()">Enter</button>
  <span id="login-error">Incorrect password</span>
</div>

<div id="admin-screen">
  <header>
    <div class="brand">MATT McCLAY <span>Calendar Manager</span></div>
    <div id="status-bar" class="idle">No unsaved changes</div>
    <button id="publish-btn" onclick="publish()">Save &amp; Publish</button>
  </header>

  <div class="main">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:rgba(45,106,79,0.5);border:1px solid rgba(45,106,79,0.8)"></div>Available</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(180,40,40,0.5);border:1px solid rgba(180,40,40,0.7)"></div>Booked</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(189,92,0,0.5);border:1px solid rgba(189,92,0,0.7)"></div>On Hold</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(176,183,190,0.2);border:1px solid rgba(176,183,190,0.3)"></div>Unavailable</div>
      <div class="legend-hint">Click to cycle: Available → Booked → Hold → Unavailable → Available</div>
    </div>

    <div class="year-tabs" id="year-tabs"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<!-- Client label popup -->
<div id="label-popup">
  <h4>Add client name? <span id="lp-date" style="color:var(--gold);font-weight:400;font-size:11px"></span></h4>
  <p>Optional — shows on your calendar for reference</p>
  <input id="label-input" type="text" placeholder="e.g. Smith Realty — 123 Oak St" onkeydown="if(event.key==='Enter')lpSave();if(event.key==='Escape')lpCancel()"/>
  <div class="popup-btns">
    <button id="lp-save"   onclick="lpSave()">Save name</button>
    <button id="lp-skip"   onclick="lpSkip()">Skip</button>
    <button id="lp-cancel" onclick="lpCancel()">Undo</button>
  </div>
</div>

<script>
const PW = 'calzone'
const YEARS = [new Date().getFullYear(), new Date().getFullYear()+1, new Date().getFullYear()+2]
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December']
const DS = ['Su','Mo','Tu','We','Th','Fr','Sa']

let av = { bookedDates:[], holdDates:[], unavailableDates:[], bookedLabels:{} }
let dirty = false
let activeYear = YEARS[0]
let lpDate = null  // date pending label

// ── Login ────────────────────────────────────────────────────────────────
function login() {
  if (document.getElementById('pw-input').value === PW) {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('admin-screen').style.display = 'block'
    load()
  } else {
    document.getElementById('login-error').style.display = 'block'
    document.getElementById('pw-input').value = ''
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') lpCancel()
})

// ── Load ─────────────────────────────────────────────────────────────────
async function load() {
  try {
    const r = await fetch('/availability.json?t='+Date.now())
    if (r.ok) av = await r.json()
    if (!av.bookedDates)      av.bookedDates = []
    if (!av.holdDates)        av.holdDates = []
    if (!av.unavailableDates) av.unavailableDates = []
    if (!av.bookedLabels)     av.bookedLabels = {}
  } catch(e) {}
  renderTabs()
  renderCal()
}

// ── Tabs ─────────────────────────────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById('year-tabs')
  el.innerHTML = ''
  YEARS.forEach(y => {
    const b = document.createElement('button')
    b.className = 'year-tab' + (y===activeYear?' active':'')
    b.textContent = y
    b.onclick = () => { activeYear=y; renderTabs(); renderCal() }
    el.appendChild(b)
  })
}

// ── Calendar ─────────────────────────────────────────────────────────────
function renderCal() {
  const grid = document.getElementById('cal-grid')
  grid.innerHTML = ''
  const today = new Date(); today.setHours(0,0,0,0)

  for (let m=0; m<12; m++) {
    const block = document.createElement('div')
    block.className = 'month-block'
    block.innerHTML = `<div class="month-name">${MN[m]}</div>
      <div class="dh-grid">${DS.map(d=>`<div class="dh">${d}</div>`).join('')}</div>
      <div class="d-grid" id="dg-${m}"></div>`
    grid.appendChild(block)

    const dg = document.getElementById('dg-'+m)
    const fd = new Date(activeYear,m,1).getDay()
    const dim = new Date(activeYear,m+1,0).getDate()

    for (let i=0;i<fd;i++) {
      const e=document.createElement('div'); e.className='dc empty'; dg.appendChild(e)
    }
    for (let d=1;d<=dim;d++) {
      const ds = fmt(activeYear,m,d)
      const dt = new Date(activeYear,m,d); dt.setHours(0,0,0,0)
      const past = dt < today
      const cell = document.createElement('div')
      const st = past ? 'past' : getStatus(ds)
      cell.className = 'dc ' + (past ? 'past' : st)
      cell.innerHTML = `<span>${d}</span>`
      if (av.bookedLabels[ds]) {
        const lbl = document.createElement('div')
        lbl.className = 'dc-lbl'
        lbl.textContent = av.bookedLabels[ds]
        lbl.title = av.bookedLabels[ds]
        cell.appendChild(lbl)
      }
      if (!past) cell.addEventListener('click', () => handleClick(ds))
      dg.appendChild(cell)
    }
  }
}

function fmt(y,m,d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
}

function getStatus(ds) {
  if (av.bookedDates.includes(ds))      return 'bk'
  if (av.holdDates.includes(ds))        return 'hd'
  if (av.unavailableDates.includes(ds)) return 'un'
  return 'av'
}

function clearDate(ds) {
  av.bookedDates      = av.bookedDates.filter(d=>d!==ds)
  av.holdDates        = av.holdDates.filter(d=>d!==ds)
  av.unavailableDates = av.unavailableDates.filter(d=>d!==ds)
  delete av.bookedLabels[ds]
}

// ── Click handler — cycles immediately, THEN offers label for booked ──────
function handleClick(ds) {
  const st = getStatus(ds)
  clearDate(ds)

  if (st === 'av') {
    // → Booked immediately, then offer label
    av.bookedDates.push(ds)
    markDirty()
    renderCal()
    showLabelPopup(ds)
    return
  } else if (st === 'bk') {
    av.holdDates.push(ds)
  } else if (st === 'hd') {
    av.unavailableDates.push(ds)
  }
  // 'un' → back to available (already cleared)
  markDirty()
  renderCal()
}

// ── Label popup ───────────────────────────────────────────────────────────
function showLabelPopup(ds) {
  lpDate = ds
  const popup = document.getElementById('label-popup')
  const d = new Date(ds+'T12:00:00')
  document.getElementById('lp-date').textContent = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
  document.getElementById('label-input').value = av.bookedLabels[ds] || ''
  popup.style.display = 'block'
  // Position near centre of screen
  popup.style.left = '50%'
  popup.style.top  = '50%'
  popup.style.transform = 'translate(-50%,-50%)'
  document.getElementById('label-input').focus()
}

function lpSave() {
  if (!lpDate) return
  const val = document.getElementById('label-input').value.trim()
  if (val) av.bookedLabels[lpDate] = val
  lpDate = null
  document.getElementById('label-popup').style.display = 'none'
  renderCal()
}

function lpSkip() {
  lpDate = null
  document.getElementById('label-popup').style.display = 'none'
}

function lpCancel() {
  // Undo the booked status
  if (lpDate) {
    clearDate(lpDate)
    lpDate = null
    markDirty()
    renderCal()
  }
  document.getElementById('label-popup').style.display = 'none'
}

// ── Dirty state ───────────────────────────────────────────────────────────
function markDirty() {
  dirty = true
  const bar = document.getElementById('status-bar')
  bar.className = 'unsaved'
  bar.textContent = '● Unsaved changes'
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue='' } })

// ── Publish ───────────────────────────────────────────────────────────────
async function publish() {
  const btn = document.getElementById('publish-btn')
  const bar = document.getElementById('status-bar')
  btn.disabled = true
  bar.className = 'saving'
  bar.textContent = 'Publishing…'

  try {
    const res = await fetch('/api/publish-availability', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ availability: av }),
    })
    const data = await res.json()
    if (res.ok && data.success) {
      dirty = false
      bar.className = 'success'
      bar.textContent = '✓ Published — live in ~60 seconds'
      setTimeout(() => { bar.className='idle'; bar.textContent='No unsaved changes' }, 8000)
    } else {
      throw new Error(data.error || 'Publish failed')
    }
  } catch(err) {
    bar.className = 'error'
    bar.textContent = '✗ ' + err.message
  }
  btn.disabled = false
}
</script>
</body>
</html>
