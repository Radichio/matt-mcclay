<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Matt McClay — Calendar Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:  #133951;
    --dark:  #0d2535;
    --gold:  #DA9100;
    --pearl: #B0B7BE;
    --bone:  #E3DAC9;
    --clay:  #BD5C00;
    --available:   rgba(45,106,79,0.35);
    --booked:      rgba(180,40,40,0.4);
    --hold:        rgba(189,92,0,0.4);
    --unavailable: rgba(176,183,190,0.15);
    --available-b:   rgba(45,106,79,0.8);
    --booked-b:      rgba(180,40,40,0.7);
    --hold-b:        rgba(189,92,0,0.8);
    --unavailable-b: rgba(176,183,190,0.3);
  }

  body {
    background: var(--dark);
    color: var(--bone);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 40px;
  }
  #login-screen h1 {
    font-size: 22px;
    color: var(--bone);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  #login-screen p {
    font-size: 13px;
    color: rgba(227,218,201,0.45);
    margin-bottom: 16px;
  }
  #pw-input {
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(227,218,201,0.2);
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 15px;
    color: var(--bone);
    outline: none;
    width: 260px;
    text-align: center;
    letter-spacing: 0.1em;
  }
  #pw-input:focus { border-color: var(--gold); }
  #login-btn {
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 13px 32px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    width: 260px;
  }
  #login-error {
    font-size: 12px;
    color: #f87171;
    display: none;
  }

  /* ADMIN */
  #admin-screen { display: none; padding: 0 0 60px; }

  header {
    background: rgba(13,37,53,0.97);
    border-bottom: 0.5px solid rgba(218,145,0,0.2);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
    flex-wrap: wrap;
  }
  header .brand { font-size: 14px; color: var(--bone); letter-spacing: 0.08em; font-weight: 600; }
  header .brand span { color: var(--gold); font-size: 11px; font-weight: 400; display: block; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

  #status-bar {
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 6px;
    min-width: 200px;
    text-align: center;
    font-weight: 600;
  }
  #status-bar.idle    { background: rgba(255,255,255,0.05); color: rgba(227,218,201,0.4); }
  #status-bar.saving  { background: rgba(218,145,0,0.15);   color: var(--gold); }
  #status-bar.success { background: rgba(45,106,79,0.25);   color: #6ee7b7; }
  #status-bar.error   { background: rgba(180,40,40,0.25);   color: #fca5a5; }

  #publish-btn {
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #publish-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .main { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 32px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(227,218,201,0.08);
    border-radius: 10px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(227,218,201,0.65); }
  .legend-dot  { width: 14px; height: 14px; border-radius: 3px; }

  /* YEAR TABS */
  .year-tabs { display: flex; gap: 8px; margin-bottom: 28px; }
  .year-tab {
    background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(227,218,201,0.1);
    border-radius: 6px;
    padding: 8px 20px;
    font-size: 13px;
    color: rgba(227,218,201,0.55);
    cursor: pointer;
    transition: all 0.2s;
  }
  .year-tab.active {
    background: rgba(218,145,0,0.12);
    border-color: var(--gold);
    color: var(--gold);
    font-weight: 600;
  }

  /* CALENDAR GRID */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  @media (max-width: 700px) { .calendar-grid { grid-template-columns: 1fr; } }

  .month-block {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(227,218,201,0.08);
    border-radius: 12px;
    padding: 16px;
  }
  .month-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-align: center;
  }
  .day-headers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .day-header {
    text-align: center;
    font-size: 8px;
    color: rgba(227,218,201,0.3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 0;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.12s;
    position: relative;
    flex-direction: column;
    gap: 1px;
  }
  .day-cell.empty { cursor: default; }
  .day-cell.past  { opacity: 0.25; cursor: default; }
  .day-cell.available   { background: var(--available);   border-color: var(--available-b);   color: var(--bone); }
  .day-cell.booked      { background: var(--booked);      border-color: var(--booked-b);      color: var(--bone); }
  .day-cell.hold        { background: var(--hold);        border-color: var(--hold-b);        color: var(--bone); }
  .day-cell.unavailable { background: var(--unavailable); border-color: var(--unavailable-b); color: rgba(227,218,201,0.4); }
  .day-cell:not(.empty):not(.past):hover { filter: brightness(1.3); transform: scale(1.08); z-index: 2; }
  .day-label { font-size: 7px; letter-spacing: 0.04em; color: var(--gold); line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* MODAL */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--navy);
    border: 0.5px solid rgba(218,145,0,0.3);
    border-radius: 14px;
    padding: 32px;
    width: 340px;
    max-width: 90vw;
  }
  #modal h3 { font-size: 16px; color: var(--bone); margin-bottom: 6px; }
  #modal p  { font-size: 12px; color: rgba(227,218,201,0.5); margin-bottom: 20px; }
  #client-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(227,218,201,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--bone);
    outline: none;
    margin-bottom: 16px;
  }
  #client-input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1;
    padding: 11px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  #modal-save   { background: var(--gold); color: var(--dark); }
  #modal-cancel { background: rgba(255,255,255,0.06); color: var(--bone); border: 0.5px solid rgba(227,218,201,0.15) !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <h1>MATT McCLAY</h1>
  <p>Calendar Admin — enter password to continue</p>
  <input id="pw-input" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/>
  <button id="login-btn" onclick="doLogin()">Enter</button>
  <span id="login-error">Incorrect password</span>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <header>
    <div class="brand">MATT McCLAY <span>Calendar Manager</span></div>
    <div id="status-bar" class="idle">No unsaved changes</div>
    <button id="publish-btn" onclick="publishCalendar()">Save &amp; Publish</button>
  </header>

  <div class="main">

    <!-- LEGEND -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--available);border:1px solid var(--available-b)"></div>Available
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--booked);border:1px solid var(--booked-b)"></div>Booked
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--hold);border:1px solid var(--hold-b)"></div>On Hold
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--unavailable);border:1px solid var(--unavailable-b)"></div>Unavailable
      </div>
      <div class="legend-item" style="margin-left:auto;color:rgba(227,218,201,0.35);font-size:11px;">
        Click a date to cycle status · Booked prompts for client name
      </div>
    </div>

    <!-- YEAR TABS -->
    <div class="year-tabs" id="year-tabs"></div>

    <!-- CALENDAR -->
    <div class="calendar-grid" id="calendar-grid"></div>

  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3>Client Name</h3>
    <p>Add a client name for this booking (optional)</p>
    <input id="client-input" type="text" placeholder="e.g. Smith Realty — 123 Oak St"/>
    <div class="modal-btns">
      <button id="modal-cancel" onclick="closeModal()">Cancel</button>
      <button id="modal-save"   onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'calzone'

// ── State ──────────────────────────────────────────────────────────────────
let availability = {
  bookedDates:      [],
  holdDates:        [],
  unavailableDates: [],
  bookedLabels:     {}
}
let hasUnsaved    = false
let activeYear    = new Date().getFullYear()
let pendingDate   = null
const YEARS       = [new Date().getFullYear(), new Date().getFullYear()+1, new Date().getFullYear()+2]
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December']
const DAYS_SHORT  = ['Su','Mo','Tu','We','Th','Fr','Sa']

// ── Login ──────────────────────────────────────────────────────────────────
function doLogin() {
  const pw = document.getElementById('pw-input').value
  if (pw === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('admin-screen').style.display = 'block'
    loadAvailability()
  } else {
    document.getElementById('login-error').style.display = 'block'
    document.getElementById('pw-input').value = ''
    document.getElementById('pw-input').focus()
  }
}

// ── Load current availability ──────────────────────────────────────────────
async function loadAvailability() {
  try {
    const res = await fetch('/availability.json?t=' + Date.now())
    if (res.ok) availability = await res.json()
  } catch(e) {}
  renderYearTabs()
  renderCalendar()
}

// ── Render year tabs ───────────────────────────────────────────────────────
function renderYearTabs() {
  const container = document.getElementById('year-tabs')
  container.innerHTML = ''
  YEARS.forEach(y => {
    const btn = document.createElement('button')
    btn.className = 'year-tab' + (y === activeYear ? ' active' : '')
    btn.textContent = y
    btn.onclick = () => { activeYear = y; renderYearTabs(); renderCalendar() }
    container.appendChild(btn)
  })
}

// ── Render calendar ────────────────────────────────────────────────────────
function renderCalendar() {
  const grid   = document.getElementById('calendar-grid')
  const today  = new Date(); today.setHours(0,0,0,0)
  grid.innerHTML = ''

  for (let m = 0; m < 12; m++) {
    const block = document.createElement('div')
    block.className = 'month-block'

    const title = document.createElement('div')
    title.className = 'month-title'
    title.textContent = MONTHS_LONG[m]
    block.appendChild(title)

    const headers = document.createElement('div')
    headers.className = 'day-headers'
    DAYS_SHORT.forEach(d => {
      const h = document.createElement('div')
      h.className = 'day-header'
      h.textContent = d
      headers.appendChild(h)
    })
    block.appendChild(headers)

    const daysGrid  = document.createElement('div')
    daysGrid.className = 'days-grid'

    const firstDay    = new Date(activeYear, m, 1).getDay()
    const daysInMonth = new Date(activeYear, m+1, 0).getDate()

    for (let i=0; i<firstDay; i++) {
      const empty = document.createElement('div')
      empty.className = 'day-cell empty'
      daysGrid.appendChild(empty)
    }

    for (let d=1; d<=daysInMonth; d++) {
      const ds   = `${activeYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
      const dt   = new Date(activeYear, m, d); dt.setHours(0,0,0,0)
      const past = dt < today
      const cell = document.createElement('div')

      const status = getStatus(ds)
      cell.className = `day-cell ${past ? 'past' : status}`
      cell.dataset.date = ds

      const num = document.createElement('span')
      num.textContent = d
      cell.appendChild(num)

      if (availability.bookedLabels?.[ds]) {
        const lbl = document.createElement('div')
        lbl.className = 'day-label'
        lbl.textContent = availability.bookedLabels[ds]
        lbl.title = availability.bookedLabels[ds]
        cell.appendChild(lbl)
      }

      if (!past) cell.onclick = () => cycleStatus(ds)
      daysGrid.appendChild(cell)
    }

    block.appendChild(daysGrid)
    grid.appendChild(block)
  }
}

// ── Status helpers ─────────────────────────────────────────────────────────
function getStatus(ds) {
  if (availability.bookedDates?.includes(ds))      return 'booked'
  if (availability.holdDates?.includes(ds))        return 'hold'
  if (availability.unavailableDates?.includes(ds)) return 'unavailable'
  return 'available'
}

function removeFromAll(ds) {
  availability.bookedDates      = (availability.bookedDates      || []).filter(d=>d!==ds)
  availability.holdDates        = (availability.holdDates        || []).filter(d=>d!==ds)
  availability.unavailableDates = (availability.unavailableDates || []).filter(d=>d!==ds)
  delete availability.bookedLabels?.[ds]
}

function cycleStatus(ds) {
  const current = getStatus(ds)
  removeFromAll(ds)

  if (current === 'available') {
    // → Booked (prompt for name)
    pendingDate = ds
    document.getElementById('client-input').value = ''
    document.getElementById('modal-overlay').classList.add('open')
    document.getElementById('client-input').focus()
    return
  } else if (current === 'booked') {
    availability.holdDates.push(ds)
  } else if (current === 'hold') {
    availability.unavailableDates.push(ds)
  } else {
    // unavailable → back to available (do nothing — already removed)
  }

  markUnsaved()
  renderCalendar()
}

// ── Modal ──────────────────────────────────────────────────────────────────
function closeModal() {
  pendingDate = null
  document.getElementById('modal-overlay').classList.remove('open')
}

function saveModal() {
  if (!pendingDate) return
  const label = document.getElementById('client-input').value.trim()
  availability.bookedDates = availability.bookedDates || []
  availability.bookedDates.push(pendingDate)
  if (label) {
    availability.bookedLabels = availability.bookedLabels || {}
    availability.bookedLabels[pendingDate] = label
  }
  closeModal()
  markUnsaved()
  renderCalendar()
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal()
  if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) saveModal()
})

// ── Unsaved state ──────────────────────────────────────────────────────────
function markUnsaved() {
  hasUnsaved = true
  const bar = document.getElementById('status-bar')
  bar.className = 'saving'
  bar.textContent = 'Unsaved changes'
}

window.addEventListener('beforeunload', e => {
  if (hasUnsaved) { e.preventDefault(); e.returnValue = '' }
})

// ── Publish ────────────────────────────────────────────────────────────────
async function publishCalendar() {
  const btn = document.getElementById('publish-btn')
  const bar = document.getElementById('status-bar')
  btn.disabled = true
  bar.className = 'saving'
  bar.textContent = 'Publishing…'

  try {
    const res = await fetch('/api/publish-availability', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ availability }),
    })
    const data = await res.json()

    if (res.ok && data.success) {
      hasUnsaved = false
      bar.className = 'success'
      bar.textContent = '✓ Published — live in ~60 seconds'
      setTimeout(() => {
        bar.className = 'idle'
        bar.textContent = 'No unsaved changes'
      }, 8000)
    } else {
      throw new Error(data.error || 'Publish failed')
    }
  } catch (err) {
    bar.className = 'error'
    bar.textContent = '✗ Error: ' + err.message
  }

  btn.disabled = false
}
</script>
</body>
</html>
