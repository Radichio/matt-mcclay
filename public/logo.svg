<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">

  <!-- LEFT MOUNTAIN -->
  <polygon points="20,125 88,25 125,125" fill="#E3DAC9"/>
  <polygon points="20,125 52,78 63,125" fill="rgba(13,37,53,0.30)"/>
  <polygon points="69,58 88,25 100,50 80,90" fill="rgba(13,37,53,0.18)"/>

  <!-- RIGHT MOUNTAIN — bone body, pearl peak -->
  <polygon points="102,125 142,42 170,42 162,125" fill="#E3DAC9" opacity="0.80"/>
  <polygon points="142,42 157,20 170,42" fill="#B0B7BE"/>

  <!-- DRONE ICON — Gold -->
  <g transform="translate(182,14)">
    <line x1="9" y1="1"  x2="9" y2="17" stroke="#DA9100" stroke-width="2" stroke-linecap="round"/>
    <line x1="1" y1="9"  x2="17" y2="9" stroke="#DA9100" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9"  cy="1"  r="3.2" fill="#DA9100"/>
    <circle cx="9"  cy="17" r="3.2" fill="#DA9100"/>
    <circle cx="1"  cy="9"  r="3.2" fill="#DA9100"/>
    <circle cx="17" cy="9"  r="3.2" fill="#DA9100"/>
  </g>

  <!-- MATT McCLAY — full name, no clipping -->
  <text x="210" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="48" font-weight="400"
    fill="#E3DAC9" letter-spacing="1">Matt McClay</text>

  <!-- + ASSOCIATES -->
  <text x="215" y="112"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="300"
    fill="#B0B7BE" letter-spacing="5">+ ASSOCIATES</text>

</svg>
